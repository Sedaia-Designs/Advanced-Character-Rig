schema_version = "1.0.0"

id = "Sakura_Rig_GUI"
version = "4.0.0"
name = "Sakura Character Rig Interface"
tagline = "Controls and skin tools for SACR R7.5.0 and R7.4.1"
maintainer = "Sakura Sedaia"
type = "add-on"
website = "https://www.sedaia-designs.org/products/sakura-character-rig"

tags = ["Rigging", "User Interface"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Download Minecraft skin data when Online Access is enabled"
files = "Store downloaded Minecraft player skin data in extension storage"
# clipboard = "Copy and paste bone transforms"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/.agents/",
  "/.venv/",
  "/.idea/",
  "/.gitignore",
  "/.gitattributes",
  "/.DS_Store",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/scripts/",
  "/blender-workspace.toml",
  "/pyproject.toml",
  "/uv.lock",
]
