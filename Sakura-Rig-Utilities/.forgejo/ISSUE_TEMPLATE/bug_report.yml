name: Bug Report
description: Create a report to help us improve.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue here...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Blender...
        2. Load the SACR rig...
        3. Click on...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add any screenshots or logs (e.g., from the System Console) that might help.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the extension are you using? (Check the Addon Preferences or manifest.toml)
      placeholder: e.g. 4.0.0
    validations:
      required: true
  - type: input
    id: blender_version
    attributes:
      label: Blender Version
      description: What version of Blender are you using?
      placeholder: e.g. 4.2.1
    validations:
      required: true
