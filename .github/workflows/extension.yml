name: Extension

on:
  push:
    branches:
      - main
    tags:
      - 'extension/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing extension tag to package and publish (leave blank to build only)
        required: false
        type: string

jobs:
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate extension
        run: |
          python -m compileall -q Extension
          python - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Extension/blender_manifest.toml').read_text())
          assert manifest['id']
          assert manifest['version']
          assert manifest['type'] == 'add-on'
          PY

      - name: Determine archive name
        id: metadata
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Extension/blender_manifest.toml').read_text())
          name = f"{manifest['id']}_{manifest['version']}"
          release_name = f"Release {manifest['version']}"
          beta_label = manifest.get('beta_version', '').strip()
          beta = beta_label.replace(' ', '')
          if beta:
              name += f'_{beta}'
              release_name += f' ({beta_label})'
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'filename={name}.zip\n')
              output.write(f"version={manifest['version']}\n")
              output.write(f'release_name={release_name}\n')
          PY

      - name: Build extension archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/${{ steps.metadata.outputs.filename }}" HEAD:Extension

      - uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: dist/${{ steps.metadata.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged extension
        if: startsWith(github.ref, 'refs/tags/extension/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ARCHIVE: dist/${{ steps.metadata.outputs.filename }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
        run: |
          case "$RELEASE_TAG" in
            extension/*) ;;
            *) echo 'Release tag must start with extension/' >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          flags=()
          case "${RELEASE_TAG,,}" in
            *alpha*|*beta*|*rc*) flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" "$ARCHIVE" \
            --verify-tag \
            --title "$RELEASE_NAME" \
            --notes "Automated release for $RELEASE_TAG." \
            "${flags[@]}"
